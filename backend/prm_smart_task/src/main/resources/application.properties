spring.application.name=prm_smart_task
spring.config.import=optional:file:.env[.properties]
server.port=${PORT:8080}

# JWT Configuration
security.jwt.secret=${JWT_SECRET}
security.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
security.jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:604800000}
security.google.client-id=${GOOGLE_CLIENT_ID:}
app.cors.allowed-origin-patterns=${CORS_ALLOWED_ORIGINS:http://localhost,http://localhost:*,http://127.0.0.1,http://127.0.0.1:*,https://localhost,https://localhost:*,https://127.0.0.1,https://127.0.0.1:*}

# Mailjet Send API v3.1 configuration for password reset emails
mailjet.api-key-public=${MJ_APIKEY_PUBLIC:}
mailjet.api-key-private=${MJ_APIKEY_PRIVATE:}
app.mail.from-email=${MAILJET_FROM_EMAIL:}
app.mail.from-name=${MAILJET_FROM_NAME:PRM Smart Task}

# PostgreSQL Database Configuration - Override via environment variables
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/prm_smart_task?sslmode=disable}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration - Override via environment variables
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Cloudinary Configuration - Override via environment variables
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:your-cloud-name}
cloudinary.api-key=${CLOUDINARY_API_KEY:your-api-key}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:your-api-secret}

# PayOS Configuration
payos.client-id=${PAYOS_CLIENT_ID:}
payos.api-key=${PAYOS_API_KEY:}
payos.checksum-key=${PAYOS_CHECKSUM_KEY:}
payos.api-base-url=${PAYOS_API_BASE_URL:https://api-merchant.payos.vn}
payos.return-url=${PAYOS_RETURN_URL:http://localhost:8080/payment/success}
payos.cancel-url=${PAYOS_CANCEL_URL:http://localhost:8080/payment/cancel}

# File upload size limit (max 10MB for all uploads)
# Note: Avatar uploads have strict limit of 5MB enforced on service layer
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
